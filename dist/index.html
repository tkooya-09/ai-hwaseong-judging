 return head('FINAL RESULTS','최종 심사 집계',`집계 완료 ${new Date(state.finalizedAt).toLocaleString('ko-KR')} · 시민·공무원 부문별 순위`, '<button id="csv">CSV 다운로드</button><button id="backup">전체 점수 백업</button><button id="print" class="primary">결과·서명부 출력 (A4 1장)</button>')+`<div class="resulttop"><h2>심사위원 5명 · 6개 작품 · 150개 평가항목</h2><p>합계는 5명 점수를 합산한 500점 만점, 평균은 합계 ÷ 5로 계산한 100점 만점입니다.</p></div>${ties?'<div class="notice">동점이 있습니다. 공동순위로 표시하며, 동점 작품의 최종 수상등급은 심사위원 협의로 결정해야 합니다.</div>':''}${['시민','공무원'].map(cat=>`<section class="panel"><div class="panelhead"><h2>${cat} 부문</h2><span class="badge done">3작품 집계 완료</span></div><div class="tablewrap"><table><thead><tr><th>순위</th><th>작품 · 발표자</th>${D.judges.map(j=>`<th class="center">${esc(j.name)}</th>`).join('')}<th class="center">합계 / 500</th><th class="center">평균 / 100</th><th>수상등급(참고)</th></tr></thead><tbody>${rows.filter(r=>r.category===cat).map(r=>`<tr><td><span class="rank">${r.tied?'공동 ':''}${r.rank}</span></td><td><button class="worktitle" data-detail="${r.id}">${esc(r.name)}</button><span class="category">${esc(r.presenter)}</span></td>${r.scores.map(s=>`<td class="center">${s}</td>`).join('')}<td class="center scorebold">${r.sum}</td><td class="center">${r.average.toFixed(2)}</td><td><span class="badge ${r.tied?'tie':'working'}">${r.award}</span></td></tr>`).join('')}</tbody></table></div></section>`).join('')}<p class="summary-note">최고·최저점 제외 및 가점 없이 5명 점수를 모두 합산합니다. 동점은 공동순위(예: 1·1·3)로 표시합니다. 수상등급은 점수 순위에 따른 참고 표시이며 최종 시상은 심사위원회 결정에 따릅니다.</p><section class="panel signature-preview">${JudgingPrint.signatures()}<p class="print-tip">‘결과·서명부 출력’을 누르면 시민·공무원 결과와 위 서명란이 A4 가로 한 장으로 출력됩니다. 인쇄 설정: A4 · 가로 · 배율 100% · 머리글/바닥글 해제.</p></section>`;

$('#restorefile').onchange=async e=>{
 const file=e.target.files[0];e.target.value='';if(!file||!local||role!=='admin')return;
 try{
  if(file.size>5000000)throw Error('5MB 이하의 전체 점수 백업 JSON을 선택하세요.');
  const backup=JSON.parse(await file.text()),restored=backup.state;
  if(!backup.event||JSON.stringify(backup.event)!==JSON.stringify(D))throw Error('이 행사와 작품·심사위원 정보가 일치하는 전체 점수 백업을 선택하세요.');
  if(!restored||restored.schema!==1||!Number.isInteger(restored.revision)||restored.revision<0||typeof restored.finalized!=='boolean'||!Array.isArray(restored.audit)||Object.keys(restored.ballots||{}).length!==5)throw Error('전체 점수 백업 형식이 올바르지 않습니다.');
  for(const j of D.judges){const b=restored.ballots[j.id];if(!b||!Number.isInteger(b.revision)||b.revision<0||typeof b.submitted!=='boolean')throw Error('심사위원별 상태를 확인할 수 없습니다.');C.validate(b.scores);if(b.submitted&&C.filled(b.scores)!==30)throw Error('제출한 심사표에 빈 점수가 있습니다.');}
  if(restored.finalized&&(!D.judges.every(j=>restored.ballots[j.id].submitted)||!restored.finalizedAt||!Number.isFinite(Date.parse(restored.finalizedAt))))throw Error('완료된 집계 정보가 올바르지 않습니다.');
  if(restored.finalized)C.ranking(restored);
  if(!confirm('선택한 백업의 점수로 이 브라우저의 단일 PC 데이터를 교체할까요? 현재 점수가 필요하면 먼저 전체 점수 백업을 저장하세요.'))return;
  localStorage.setItem(LOCAL_KEY,JSON.stringify(restored));state=restored;setDraft();view=state.finalized?'results':'monitor';render();toast('기존 심사점수를 불러왔습니다.');
 }catch(err){toast('불러오기 실패: '+err.message);}
};

 if($('#submit'))$('#submit').onclick=async()=>{if(!confirm('6개 작품의 심사표를 제출할까요? 제출 후에는 점수가 잠깁니다.'))return;try{await flush();await change({type:'submit',expectedRevision:draftRevision});setDraft();render();toast('심사표 제출이 완료되었습니다.');}catch(e){toast(e.message);}};
 if($('#finalize'))$('#finalize').onclick=async()=>{if(!confirm('전체 심사를 완료하고 시민·공무원 부문별 결과를 집계할까요?'))return;try{await change({type:'finalize'});view='results';render();toast('전체 심사 집계가 완료되었습니다.');}catch(e){toast(e.message);}};
 document.querySelectorAll('[data-reopen]').forEach(el=>el.onclick=async()=>{const reason=prompt('심사표를 다시 여는 사유를 입력하세요. 최종 집계가 완료된 경우 결과 공개도 해제됩니다.');if(reason===null)return;try{await change({type:'reopen',judgeId:el.dataset.reopen,reason});render();toast('수정을 허용했습니다. 해당 위원의 재제출이 필요합니다.');}catch(e){toast(e.message);}});
 if($('#backup')){$('#backup').onclick=backup;if(local&&role==='admin'){const importButton=document.createElement('button');importButton.textContent='점수 백업 불러오기';importButton.onclick=()=>$('#restorefile').click();$('#backup').after(importButton);}}if($('#csv'))$('#csv').onclick=csv;if($('#print'))$('#print').onclick=printResults;
}
function login(message='',adminLogin=false){
 mode();$('#rolebox').innerHTML='';
 $('#main').innerHTML=`<div class="login"><div class="eyebrow">AI화성 챌린지</div><h1>${adminLogin?'운영자 접속':'심사위원 접속'}</h1><p class="desc">${adminLogin?'운영자 전용 접속 코드를 입력하세요.':'본인의 이름을 입력하면 심사 화면이 열립니다.'}</p><form id="loginform"><label for="code">${adminLogin?'운영자 접속 코드':'심사위원 이름'}</label><input id="code" type="${adminLogin?'password':'text'}" autocomplete="${adminLogin?'off':'name'}" required placeholder="${adminLogin?'운영자 코드 입력':'이름 입력'}"><button class="primary" type="submit">심사실 접속</button></form><p class="desc error" id="loginerror" role="alert">${esc(message)}</p><p class="desc">입력한 점수는 자동 저장되고 운영자 화면에 함께 집계됩니다.</p><button id="loginmode" class="small" style="margin-top:16px">${adminLogin?'심사위원 이름으로 접속':'운영자 접속'}</button><details style="margin-top:20px"><summary>한 기기에서만 사용하기</summary><button id="localstart" class="small" style="margin-top:12px">단일 PC 모드로 사용</button><p class="desc">이 모드의 점수는 다른 기기와 공유되지 않습니다.</p></details></div>`;
 $('#loginmode').onclick=()=>login('',!adminLogin);
 $('#loginform').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;const value=$('#code').value.trim().normalize('NFC');token=adminLogin?value:'name:'+encodeURIComponent(value);try{const d=await api();role=d.role;state=d.state;connected=true;try{sessionStorage.setItem('judging-token',token);}catch{}lastSync=time(new Date().toISOString());setDraft();view=role==='admin'?'monitor':'score';render();}catch(err){$('#loginerror').textContent=err.message;button.disabled=false;}};
 $('#localstart').onclick=()=>startLocal();
}

function startLocal(){try{local=true;state=loadLocal();localStorage.setItem(LOCAL_KEY,JSON.stringify(state));role='admin';connected=true;view='monitor';setDraft();render();}catch(e){local=false;connected=false;login('브라우저 저장소를 사용할 수 없습니다. '+e.message);}}
document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{if(!local&&!connected){toast('접속 코드를 입력해 주세요.');return;}navigate(el.dataset.view);});$('#closedetail').onclick=()=>$('#detail').close();$('#detail').onclick=e=>{if(e.target===$('#detail'))$('#detail').close();};
$('#logout').onclick=async()=>{try{await flush();token='';try{sessionStorage.removeItem('judging-token');}catch{}connected=false;state=C.initial();setDraft();login();}catch(e){toast(e.message);}};
window.addEventListener('beforeunload',e=>{if(dirty||saving||invalid.size){e.preventDefault();e.returnValue='';}});
window.addEventListener('storage',e=>{if(local&&e.key===LOCAL_KEY&&!dirty&&!saving){try{state=loadLocal();setDraft();render();}catch(err){toast(err.message);}}});
setInterval(async()=>{if(local||!token||polling||saving||document.hidden)return;polling=true;try{const prior=state.revision;await refresh();if(!dirty&&!invalid.size){setDraft();if(view!=='score'||state.revision!==prior)render();}mode();}catch(e){connected=false;mode();if(e.status===401){toast('접속 코드가 변경되었습니다. 다시 접속하세요.');if(!dirty){token='';login(e.message);}}}finally{polling=false;}},3000);
(async()=>{if(local)return startLocal();if(token){try{const d=await api();state=d.state;role=d.role;connected=true;setDraft();view=role==='admin'?'monitor':'score';render();return;}catch(e){login(e.message);return;}}login();})();
</script>
</body></html>
